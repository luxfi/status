name: Build and Push Docker Image

on:
  push:
    branches: [main, dev, test]
    tags: ['v*']
  workflow_dispatch:

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/luxfi/status
      runner-amd64: evo
      runner-arm64: spark
      runner-deploy: evo
    secrets: inherit
